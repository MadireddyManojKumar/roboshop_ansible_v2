- name: roboshop-mongodb create ec2 instances
  connection: local
  hosts: local

  tasks:

#-- Creating ec2 instances when action is create
    - name: create ec2 instances
      amazon.aws.ec2_instance:
        name: roboshop-{{item}}
        image_id: "{{ ami_id }}"
        instance_type: "{{instance_type}}"
        security_groups: 
        - "roboshop-{{item}}"
        - "roboshop-common"
        region: us-east-1
      loop: "{{instances}}"
      when: action == "create"
      register: ec2_instance_creation_output
    
 #   - name: ec2 instance creation output
  #    debug:  
   #     msg: "{{ec2_instance_creation_output}}"

# -- Creating route 53 records for the ec2 instances
    - name: route 53 record creation
      amazon.aws.route53:
        state: present
        zone: "{{domain_name}}"
        record: "{{item.item}}.{{domain_name}}"
        type: A
        ttl: 1
        value: "{{item.instances[0].private_ip_address}}"
        overwrite: true
      loop: "{{ec2_instance_creation_output.results}}"
      when: action == "create"

# -- Deleting route 53 records when action is delete
    - name: route 53 record deletion
      amazon.aws.route53:
        state: absent
        zone: "{{domain_name}}"
        record: "{{item}}.{{domain_name}}"
        type: A
        ttl: 1
      loop: "{{instances}}"
      when: action == "delete"

# -- Deleting ec2 instances when action is delete
    - name: delete ec2 instances
      amazon.aws.ec2_instance:
        name: roboshop-{{item}}
        state: absent
        region: us-east-1
        wait: false
      loop: "{{instances}}"
      when: action == "delete"
      
        




      
      

